name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run API tests
        run: pytest -v

  build-push-deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Docker Hub image name in the form <dockerhub-username>/<repo-name>.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kpop-universe
      VERSION: v${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if ! sudo docker info >/dev/null 2>&1; then
              echo "Docker not available — installing it"
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y docker.io
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y docker
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker
              else
                echo "No apt/dnf/yum found — cannot install Docker" && exit 1
              fi
            fi
            sudo systemctl enable --now docker || true
            sudo usermod -aG docker $USER || true

            # Pull latest image
            sudo docker pull ${{ env.IMAGE }}:${{ env.VERSION }}

            # Free port 8001 and remove existing container
            sudo docker rm -f $(sudo docker ps -q --filter "publish=8001") || true
            sudo docker rm -f kpop-universe || true
            sudo fuser -k 8001/tcp || true

            # Persistent SQLite database storage (PRD Section 7)
            mkdir -p /home/$USER/kpop-data
            touch /home/$USER/kpop-data/kpop.db
            sudo chmod -R 777 /home/$USER/kpop-data

            # Run container with JWT_SECRET_KEY and mounted SQLite database
            sudo docker run -d \
              --name kpop-universe \
              --restart unless-stopped \
              -p 8001:8001 \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -v /home/$USER/kpop-data/kpop.db:/app/kpop.db \
              ${{ env.IMAGE }}:${{ env.VERSION }}

            sudo docker image prune -af
            sudo docker ps --filter name=kpop-universe
