name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      # Docker Hub image name in the form <dockerhub-username>/<repo-name>.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kpop-universe
      VERSION: v${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/kpop-universe/data
            if ! sudo docker info >/dev/null 2>&1; then
              echo "Docker not available — installing it"
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y docker.io
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y docker
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker
              else
                echo "No apt/dnf/yum found — cannot install Docker" && exit 1
              fi
            fi
            sudo systemctl enable --now docker || true
            sudo usermod -aG docker $USER
            sudo docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker rm -f kpop-universe || true
            sudo docker run -d --name kpop-universe --restart unless-stopped -p 8001:8001 -v /opt/kpop-universe/data:/app/data -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker image prune -af
            sudo docker ps --filter name=kpop-universe
